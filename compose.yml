services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sukali
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
    volumes:
      - .:/var/www/html

  # Service 2 : Le serveur Web NGINX
  web:
    image: nginx:alpine
    container_name: sukali_web
    restart: unless-stopped
    ports:
      - "8282:80" # Accessible sur le port 8282
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api