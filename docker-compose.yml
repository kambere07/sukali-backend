services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sukali
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
    volumes:
      - ./app/:/var/www/html

  web:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: sukali_web
    restart: unless-stopped
    # ports:
    #   - "8282:80"
    depends_on:
      - api
